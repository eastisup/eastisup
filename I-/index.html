<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../style.css" />

  <style>
    html[data-era="sai"]       { --primary: #53B6CB; }
    html[data-era="trench"]    { --primary: #FCE300; }
    html[data-era="breach"]    { --primary: #E03C31; }
    html[data-era="vessel"]    { --primary: #C2D2DF; }
    html[data-era="blurryface"]{ --primary: var(--topblurryred); }#eraTitle { text-transform: none; }
    

    .menu { width: 590px; display: flex; flex-direction: column; align-items: flex-start; }
    #eraTitle { width: 100%; text-align: left; margin: 0 0 8px 0; padding: 0; line-height: 1.08; }

    .exit-tape {
      --p: 0;
      position: fixed;
      bottom: 18px;
      left: 18px;
      padding: 8px 14px 9px;
      border-radius: 6px;
      background: rgba(0,0,0,0.35);
      border: 1px dashed rgba(255,255,255,0.35);
      color: #fff;
      letter-spacing: 4px;
      font-size: 14px;
      font-family: "Eurostile", system-ui, sans-serif;
      text-transform: uppercase;
      transform: rotate(-3deg);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      outline: none;
      z-index: 1000;
      backdrop-filter: blur(4px);
      box-shadow: 0 6px 20px rgba(0,0,0,.38);
    }
    .exit-tape::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0 6px, rgba(255,255,255,0.02) 6px 12px);
      border-radius: 6px;
      pointer-events: none;
    }
    .exit-tape::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--primary);
      opacity: 0.18;
      transform-origin: left center;
      transform: scaleX(var(--p));
      transition: transform 60ms linear;
      border-radius: 6px;
      pointer-events: none;
    }
    .exit-tape .glyph { display: inline-block; margin-right: 8px; color: var(--primary); filter: drop-shadow(0 1px 0 rgba(0,0,0,.2)); }
    .exit-tape.holding { border-style: solid; }

    html[data-era="sai"] h1        { font-family: "Bauhaus"; letter-spacing: 10px; }
    html[data-era="trench"] h1     { font-family: "Eurostile Bold"; letter-spacing: 8px; }
    html[data-era="breach"] h1     { font-family: "Clancy"; letter-spacing: 6px; }
    html[data-era="blurryface"] h1 { font-family: "Futura Light"; letter-spacing: 6px; }
    html[data-era="vessel"] h1     { font-family: "Courier New"; letter-spacing: 1px; }
  </style>

  <link rel="shortcut icon" href="/img/icon.png" type="image/x-icon" />
  <meta property="og:image" content="/img/logos/trench-logo-128.png" />
  <meta property="og:description" content="I'm fearless when I hear this on the low." />
  <meta property="og:title" content="East is Up" />
  <meta name="theme-color" content="#000000" />
  <title>EAST IS UP</title>

  <script>
    (function () {
      var m = document.cookie.match(/(?:^|;\s*)eastisup_era=([^;]+)/);
      if (!m || !m[1]) { window.location.replace("/"); return; }
      var era = decodeURIComponent(m[1]);
      document.documentElement.setAttribute("data-era", era);
    })();
  </script>
</head>

<body>
  <img src="../img/tape/Tape (3).webp" class="tape" style="top: 0; left: 0" />
  <img src="../img/tape/Tape (2).webp" class="tape" style="bottom: 0; right: 0" />

  <div class="exit-tape" id="exitTape" role="button" tabindex="0" aria-label="Hold to leave the city">
    <span class="glyph">⤺</span> LEAVE THE CITY
  </div>

  <div class="bg"></div>
  <div class="wrap">
    <div class="menu">
      <h1 id="eraTitle">East is Up</h1>
      <div class="links">
        <a href="/unicode/">Unicode</a>
        <a href="/wallpapers/">Wallpapers</a>
        <a href="/minecraft/">Minecraft</a>
        <a href="https://discord.com/invite/DKvhzNCTsm">Discord</a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var COOKIE_NAME = "eastisup_era";
      function clearEraCookie() { document.cookie = COOKIE_NAME + "=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; SameSite=Lax"; }

      var ERA_COPY = {
        breach:     { title: "HELLO CLANCY" },
        sai:        { title: "GOOD DAY DEMA" },
        trench:     { title: "EAST IS UP" },
        blurryface: { title: "THE FEW, THE PROUD AND THE EMOTIONAL" },
        vessel:     { title: "islands of violence"}
      };

      var ERA_THEME = {
        breach:     "#E03C31",
        sai:        "#53B6CB",
        trench:     "#FCE300",
        blurryface: "#E03C31",
        vessel:     "#C2D2DF"
      };

      var m = document.cookie.match(/(?:^|;\s*)eastisup_era=([^;]+)/);
      var era = m ? decodeURIComponent(m[1]) : null;

      if (era) {
        var h1 = document.getElementById("eraTitle");
        var t = (ERA_COPY[era] && ERA_COPY[era].title) || "East is Up";
        if (h1) h1.textContent = t;

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && ERA_THEME[era]) meta.setAttribute("content", ERA_THEME[era]);

        var tapes = {
          breach:     { tl: "/img/tape/breach-top.webp",     br: "/img/tape/breach-bottom.webp" },
          sai:        { tl: "/img/tape/sai-top.webp",        br: "/img/tape/sai-bottom.webp" },
          trench:     { tl: "/img/tape/trench-top.webp",     br: "/img/tape/trench-bottom.webp" },
          blurryface: { tl: "/img/tape/blurryface-top.webp", br: "/img/tape/blurryface-bottom.webp" },
          vessel:     { tl: "/img/tape/vessel-top.webp",     br: "/img/tape/vessel-bottom.webp" }
        };
        var map = tapes[era];
        if (map) {
          var imgs = document.querySelectorAll("img.tape");
          if (imgs[0]) imgs[0].src = map.tl;
          if (imgs[1]) imgs[1].src = map.br;
        }
      }

      (function () {
        var el = document.getElementById("exitTape");
        if (!el) return;
        var holdMs = 1100, raf = 0, start = 0, leaving = false;
        function update(t) {
          var p = Math.min((t - start) / holdMs, 1);
          el.style.setProperty("--p", p.toFixed(3));
          if (p >= 1 && !leaving) {
            leaving = true;
            clearEraCookie();
            window.location.replace("/");
            return;
          }
          raf = requestAnimationFrame(update);
        }
        function startHold(e) {
          e.preventDefault();
          if (leaving) return;
          el.classList.add("holding");
          start = performance.now();
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(update);
        }
        function cancelHold() {
          if (leaving) return;
          el.classList.remove("holding");
          el.style.setProperty("--p", 0);
          cancelAnimationFrame(raf);
        }
        el.addEventListener("pointerdown", startHold);
        window.addEventListener("pointerup", cancelHold);
        window.addEventListener("pointercancel", cancelHold);
        window.addEventListener("blur", cancelHold);
        el.addEventListener("keydown", function (e) { if (e.key === " " || e.key === "Enter") startHold(e); });
        el.addEventListener("keyup", function () { cancelHold(); });
      })();
    })();
  </script>
</body>
</html>
