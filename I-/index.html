<!DOCTYPE html>

  <meta property="og:title" content="East is Up" />

  <title>EAST IS UP</title>

  <script>
    (function () {
      var m = document.cookie.match(/(?:^|;\s*)eastisup_era=([^;]+)/);
      if (!m || !m[1]) { window.location.replace("/"); return; }
      var era = decodeURIComponent(m[1]);
      document.documentElement.setAttribute("data-era", era);
    })();
  </script>
</head>
