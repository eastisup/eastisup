<!doctype html>
<html lang="en">

<head>
  <style>
    @import url("https://cdn.eastisup.com/css/reset.css");
    @import url("https://cdn.eastisup.com/fonts/nickel-gothic-compressed.css");

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      min-height: 100vh;
      overflow: hidden;
    }

    .slider-viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .slider-track {
      display: flex;
      height: 100%;
      transform: translate3d(0, 0, 0);
      transition: transform 780ms cubic-bezier(.16, .84, .44, 1);
      will-change: transform;
    }

    .slide {
      flex: 0 0 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
    }

    :root {
      --content-size: clamp(280px, 76vmin, 1200px);
    }

    .slide-content {
      width: var(--content-size);
      height: var(--content-size);
      display: block;
    }

    .slide-content img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .controlsBar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(16px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
    }

    .controlsGroup {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      pointer-events: auto;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .45);

      background-color: var(--accent-bg, rgba(255, 255, 255, .12));
      border: 1px solid var(--accent-border, rgba(255, 255, 255, .25));
    }

    .arrow {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid var(--accent-border, rgba(255, 255, 255, .4));
      background: var(--accent-chip, rgba(255, 255, 255, .14));
      color: var(--accent-solid, #fff);
      display: grid;
      place-items: center;
      cursor: pointer;
      outline: none;
      transition: background 160ms ease, border-color 160ms ease, transform 120ms ease, opacity 160ms ease;
    }

    .arrow:hover {
      background: var(--accent-chip-hover, rgba(255, 255, 255, .22));
    }

    .arrow:active {
      transform: scale(0.96);
    }

    .arrow:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .arrow svg {
      width: 18px;
      height: 18px;
    }

    .dots {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0 2px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1px solid var(--accent-dot-border, rgba(255, 255, 255, .45));
      background: var(--accent-dot, rgba(255, 255, 255, .25));
      cursor: pointer;
      outline: none;
      transition: transform 140ms ease, background 160ms ease, border-color 160ms ease;
    }

    .dot:hover {
      transform: scale(1.15);
    }

    .dot[aria-selected="true"] {
      background: var(--accent-solid, #fff);
      border-color: var(--accent-solid, #fff);
      transform: scale(1.15);
    }

    @media (prefers-reduced-motion: reduce) {

      .slider-track,
      .arrow,
      .dot {
        transition: none !important;
      }
    }
  </style>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="/img/icon.png" type="image/x-icon" />
  <meta property="og:image" content="/img/icon.png" />
  <meta property="og:description" content="I'm fearless when I hear this on the low." />
  <meta property="og:title" content="East is Up" />
  <meta property="theme-color" content="#e03c31">
  <title>BREACH</title>

  <link rel="preload" as="image" href="/img/logos/breach-logo.png">
  <link rel="preload" as="image" href="/img/logos/sai-logo.png">
  <link rel="preload" as="image" href="/img/logos/trench-logo.png">
  <link rel="preload" as="image" href="/img/logos/blurryface-logo.png">
  <link rel="preload" as="image" href="/img/logos/bglogo.png">

  <script>
    (function () {
      var m = document.cookie.match(/(?:^|;\s*)eastisup_era=([^;]+)/);
      if (m && m[1]) {
        window.location.replace("/I-/");
      }
    })();
  </script>
</head>

<body>
  <div id="app"></div>

  <!-- Optimized carousel - no React, no Babel, pre-computed colors -->
  <script src="/js/carousel.js"></script>
</body>

</html>
